ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "docker-compose.yml"
          - "requirements.txt"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"

server:
  - changed-files:
      - any-glob-to-any-file:
          - "app.py"
          - "sources.py"
          - "render.py"
          - "i18n.py"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "lang/**"

kindle:
  - changed-files:
      - any-glob-to-any-file:
          - "kindle/**"

collector:
  - changed-files:
      - any-glob-to-any-file:
          - "collect/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - ".env.example"
