<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 258" width="100%" role="img" aria-label="The Proxmox host posts pool usage and SMART data to dashink every 15 minutes. dashink also polls Uptime Kuma, Open-Meteo and the Proxmox API, renders a 600 by 800 grayscale PNG, and the Kindle fetches that image every 5 minutes."><defs><marker id="dashink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-color, #6e7781)" fill-opacity="0.55"></path></marker></defs><g fill="none" stroke="var(--text-color, #6e7781)" stroke-opacity="0.28" stroke-width="1"><rect x="8" y="10" width="236" height="66" rx="6"></rect><rect x="8" y="92" width="236" height="44" rx="6"></rect><rect x="8" y="148" width="236" height="44" rx="6"></rect><rect x="8" y="204" width="236" height="44" rx="6"></rect><rect x="600" y="97" width="188" height="64" rx="6"></rect></g><rect x="320" y="10" width="176" height="238" rx="6" fill="none" stroke="var(--primary-color, #388bfd)" stroke-width="2"></rect><g fill="var(--text-color, #6e7781)" font-size="13" font-weight="600"><text x="22" y="32">pve · no Docker</text><text x="22" y="112">Uptime Kuma</text><text x="22" y="168">Open-Meteo</text><text x="22" y="224">Proxmox API</text><text x="694" y="120" text-anchor="middle" font-size="15">Kindle</text><text x="408" y="64" text-anchor="middle" font-size="16">dashink</text></g><g fill="var(--text-color, #6e7781)" fill-opacity="0.7" font-size="11.5"><text x="22" y="66">cron */15 · pool usage + SMART</text><text x="22" y="128">monitor states</text><text x="22" y="184">weather + sun</text><text x="22" y="240">uptime</text><text x="408" y="106" text-anchor="middle">on docker-apps</text><text x="408" y="172" text-anchor="middle">renders 600×800</text><text x="408" y="190" text-anchor="middle">grayscale PNG</text><text x="694" y="140" text-anchor="middle">eips → framebuffer</text></g><g fill="var(--text-color, #6e7781)" fill-opacity="0.7" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="22" y="50">dashink-collect.sh</text><text x="408" y="88" text-anchor="middle">:8099</text><text x="547" y="114" text-anchor="middle">GET /dash.png</text></g><line x1="340" y1="140" x2="476" y2="140" stroke="var(--text-color, #6e7781)" stroke-opacity="0.2" stroke-width="1"></line><g stroke="var(--text-color, #6e7781)" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#dashink-arrow)"><line x1="248" y1="43" x2="312" y2="43"></line><line x1="248" y1="114" x2="312" y2="114" stroke-dasharray="5 4"></line><line x1="248" y1="170" x2="312" y2="170" stroke-dasharray="5 4"></line><line x1="248" y1="226" x2="312" y2="226" stroke-dasharray="5 4"></line><line x1="500" y1="129" x2="594" y2="129"></line></g><g fill="var(--text-color, #6e7781)" fill-opacity="0.6" font-size="11" text-anchor="middle"><text x="280" y="36">POST</text><text x="547" y="146">every 5 min</text></g></svg>
